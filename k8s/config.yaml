apiVersion: v1
kind: ConfigMap
metadata:
  name: animalcorner-config
  namespace: default
  labels:
    app: animalcorner-scraper
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "db"
  DB_USER: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: animalcorner-secret
  namespace: default
  labels:
    app: animalcorner-scraper
type: Opaque
stringData:
  DB_PASS: "replace-with-your-secure-password"
