services:
  postgres:
    image: postgres:16-alpine
    container_name: animalcorner-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper:
    build:
      context: .
    container_name: animalcorner-scraper
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["scrapy", "crawl", "animals"]
    restart: "no"

volumes:
  postgres_data:
